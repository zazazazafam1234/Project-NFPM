services:
  postgres:
    image: postgres:16-alpine
    container_name: fastmovie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastmovie
      POSTGRES_PASSWORD: fastmovie_dev_2026
      POSTGRES_DB: fastmovie
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastmovie -d fastmovie"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
