services:
  postgres:
    image: postgres:16-alpine
    container_name: fastmovie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastmovie
      POSTGRES_PASSWORD: fastmovie_dev_2026
      POSTGRES_DB: fastmovie
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastmovie -d fastmovie"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fastmovie-backend
    restart: unless-stopped
    command: ["sh", "-c", "bun run db:migrate && bun run dev"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://fastmovie:fastmovie_dev_2026@postgres:5432/fastmovie
      PORT: 4000
      WEB_ORIGIN: http://localhost:8010
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./my-next-app
    container_name: fastmovie-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      WATCHPACK_POLLING: "true"
    ports:
      - "8010:3000"
    volumes:
      - ./my-next-app:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
