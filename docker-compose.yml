services:
  postgres:
    image: postgres:16-alpine
    container_name: fastmovie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastmovie
      POSTGRES_PASSWORD: fastmovie_dev_2026
      POSTGRES_DB: fastmovie
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastmovie -d fastmovie"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fastmovie-backend
    restart: unless-stopped
    command: ["sh", "-c", "bun run db:migrate && bun run dev"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://fastmovie:fastmovie_dev_2026@postgres:5432/fastmovie
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8020}
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  line-worker:
    build: ./backend
    container_name: fastmovie-line-worker
    restart: unless-stopped
    command: ["bun", "run", "line:worker"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://fastmovie:fastmovie_dev_2026@postgres:5432/fastmovie
      LINE_REVISION_DIR: /app/data
    volumes:
      - ./backend/src:/app/src
      - line_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: fastmovie-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "8020:3000"
    depends_on:
      - backend

  # Changes Netflix profile PINs when rentals end (see pin-service/README.md).
  # Only started where COMPOSE_PROFILES includes "pin"; the backend reaches it at
  # http://pin-service:5055 using PIN_SERVICE_KEY from backend/.env.
  pin-service:
    build:
      context: .
      dockerfile: pin-service/Dockerfile
    container_name: fastmovie-pin-service
    restart: unless-stopped
    profiles: ["pin"]
    env_file:
      - ./backend/.env
    environment:
      PIN_SERVICE_HOST: 0.0.0.0
      PIN_SERVICE_PROFILES_DIR: /data/profiles
      # Headed Chromium on the Xvfb display started by the image's CMD.
      PIN_SERVICE_HEADLESS: "false"
    volumes:
      - pin_profiles:/data/profiles
    shm_size: "1gb"

volumes:
  postgres_data:
  line_data:
  pin_profiles:
